name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mortgageflow
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: mortgageflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mortgageflow -d mortgageflow"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mortgageflow:ci-synthetic-only@localhost/mortgageflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: mypy app workers scripts
      - run: python -m pytest --cov=app --cov=workers --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
