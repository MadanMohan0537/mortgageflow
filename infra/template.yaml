AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: MortgageFlow — FastAPI API + S3 document worker (educational demo)

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Description: Shared API key for request authentication
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: SQLAlchemy database URL (use Secrets Manager in real deployments)
  EnvironmentName:
    Type: String
    Default: dev

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        APP_ENV: !Ref EnvironmentName
        API_KEY: !Ref ApiKey
        DATABASE_URL: !Ref DatabaseUrl
        S3_BUCKET: !Ref DocumentsBucket
        AWS_REGION: !Ref AWS::Region
        S3_ENDPOINT_URL: ""
        LOG_LEVEL: INFO

Resources:
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketName: !Sub mortgageflow-docs-${EnvironmentName}-${AWS::AccountId}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub mortgageflow-api-${EnvironmentName}
      Handler: app.main.handler
      CodeUri: ..
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DocumentsBucket
        - CloudWatchPutMetricPolicy: {}
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY

  DocumentWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub mortgageflow-doc-worker-${EnvironmentName}
      Handler: app.workers.document_worker.handler
      CodeUri: ..
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DocumentsBucket
        - CloudWatchPutMetricPolicy: {}
      Events:
        ObjectCreated:
          Type: S3
          Properties:
            Bucket: !Ref DocumentsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: applications/

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub mortgageflow-api-errors-${EnvironmentName}
      AlarmDescription: API Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
