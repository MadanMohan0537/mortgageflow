services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mortgageflow
      POSTGRES_USER: mortgageflow
      POSTGRES_PASSWORD: mortgageflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgageflow -d mortgageflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-s3.sh"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://mortgageflow:mortgageflow@db:5432/mortgageflow
      S3_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: mortgageflow-docs-local
      API_KEY: dev-api-key-change-me
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
